<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PALMA ROTAN — Admin</title><link rel="stylesheet" href="admin.css"></head><body class="login"><div class="loginCard"><img src="../assets/logo-palma.png" alt="PALMA ROTAN"><span>ADMIN CONTROL CENTER</span><h1>Masuk ke Admin</h1><p>Kelola website, produk, pesanan, pembayaran dan konten PALMA ROTAN.</p><form id="loginForm"><label>Email</label><input id="user" type="email" autocomplete="username" required><label>Password</label><input id="pass" type="password" autocomplete="current-password" required><button id="loginButton">Masuk</button></form><p id="loginStatus" class="sectionNote"></p><a href="../index.html">← Kembali ke website</a></div><script src="config.js?v=20260930-5"></script><script>const API=window.PALMA_API_BASE;const form=document.getElementById('loginForm');const status=document.getElementById('loginStatus');form.onsubmit=async e=>{e.preventDefault();status.textContent='Menghubungkan ke server…';document.getElementById('loginButton').disabled=true;try{const r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:document.getElementById('user').value.trim(),password:document.getElementById('pass').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login gagal');sessionStorage.setItem('palmaAdminToken',d.token);sessionStorage.setItem('palmaAdminUser',JSON.stringify(d.admin));location.href='dashboard.html'}catch(err){status.textContent=err.message||'Tidak dapat terhubung ke server.';document.getElementById('loginButton').disabled=false}}</script></body></html>
